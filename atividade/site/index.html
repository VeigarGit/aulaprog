<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciamento de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </link>
</head>

  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Gerenciamento de Tarefas</h1>

    <div class="card mb-4">
      <div class="card-body">
        <form action="/adicionar" method="POST">
          <div class="row g-2">
            <div class="col-md-5">
              <input type="text" name="titulo" class="form-control" placeholder="Título da tarefa" required />
            </div>
            <div class="col-md-5">
              <input type="text" name="descricao" class="form-control" placeholder="Descrição da tarefa" />
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100">
                Adicionar
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="btn-group mb-3" role="group">
      <a href="/" class="btn btn-outline-secondary">Todas</a>
      <a href="/?filtro=pendente" class="btn btn-outline-secondary">Pendentes</a>
      <a href="/?filtro=concluida" class="btn btn-outline-secondary">Concluídas</a>
    </div>

    <div id="lista-tarefas" class="list-group">
      {% for t in tarefas %}
      <div
        class="d-flex align-items-center gap-2 p-2 rounded {% if t.status == 'concluida' %}tarefa-concluida{% endif %}">
        <span class="{% if t.status == 'concluida' %}text-decoration-line-through{% endif %}">
          {{ t.titulo }}
        </span>
        <a href="/concluir?id={{ t.id }}&status={% if t.status == 'pendente' %}concluida{% else %}pendente{% endif %}"
          class="btn btn-sm {% if t.status == 'pendente' %}btn-outline-success{% else %}btn-success{% endif %}">
          {% if t.status == 'concluida' %} Concluída{% else %} Concluir{% endif %}
        </a>
        <a href="/editar?id={{ t.id }}" class="btn btn-sm btn-outline-primary">editar</a>
        <a href="/excluir?id={{ t.id }}" class="btn btn-sm btn-outline-danger">excluir</a>
      </div>
      {% else %}
      <p class="text-muted">Nenhuma tarefa encontrada.</p>
      {% endfor %}
    </div>
  </body>

</html>
